apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      # Only one environment runs at a time; the other target simply shows "down".
      - job_name: "fastapi"
        metrics_path: /metrics
        static_configs:
          - targets:
              - "fastapi-service.llm-baseline.svc.cluster.local:8010"
            labels:
              env: baseline
          - targets:
              - "fastapi-service.llm-secure.svc.cluster.local:8010"
            labels:
              env: secure

apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/instance: gateway
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: llm-platform

spec:
  replicas: 1

  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
      app.kubernetes.io/instance: gateway

  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
        app.kubernetes.io/instance: gateway
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: llm-platform

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001

      containers:
        - name: gateway
          image: llm-gateway:1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              name: http

          env:
            - name: UPSTREAM_URL
              value: http://fastapi-service:8010
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-api-key
                  key: API_KEY

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /_gateway/health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /_gateway/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

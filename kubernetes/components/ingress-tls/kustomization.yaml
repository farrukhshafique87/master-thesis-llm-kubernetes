# Control: TLS termination at the ingress controller (Traefik).
# Certificate files tls.crt / tls.key are git-ignored and created by
# scripts/gen-secrets.sh (self-signed, for the lab only).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - ingress.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: ingress-tls
    type: kubernetes.io/tls
    files:
      - tls.crt
      - tls.key

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mesh-ollama-allow-from-api
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: llm-api
      ports:
        - protocol: TCP
          port: 4143

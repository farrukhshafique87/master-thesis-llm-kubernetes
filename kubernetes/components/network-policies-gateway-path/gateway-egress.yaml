apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-allow-to-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: llm-api
      ports:
        - protocol: TCP
          port: 8000

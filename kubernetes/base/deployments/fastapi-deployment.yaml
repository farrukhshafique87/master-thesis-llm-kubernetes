apiVersion: apps/v1
kind: Deployment

metadata:
  name: fastapi
  namespace: llm
  labels:
    app.kubernetes.io/name: llm-api
    app.kubernetes.io/instance: fastapi
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: llm-platform
    app.kubernetes.io/managed-by: kustomize

spec:
  replicas: 1

  revisionHistoryLimit: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: llm-api
      app.kubernetes.io/instance: fastapi

  template:

    metadata:
      labels:
        app.kubernetes.io/name: llm-api
        app.kubernetes.io/instance: fastapi
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: llm-platform

    spec:

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:

        - name: fastapi

          image: llm-api:1.0.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              name: http

          envFrom:

            - configMapRef:
                name: fastapi-config

          resources:

            requests:
              cpu: "500m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "1Gi"

          startupProbe:

            httpGet:
              path: /health
              port: 8000

            failureThreshold: 30

            periodSeconds: 10

          readinessProbe:

            httpGet:
              path: /ready
              port: 8000

            initialDelaySeconds: 15

            periodSeconds: 10

            timeoutSeconds: 5

            failureThreshold: 3

          livenessProbe:

            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 30

            periodSeconds: 15

            timeoutSeconds: 5

            failureThreshold: 3

          securityContext:

            allowPrivilegeEscalation: false

            readOnlyRootFilesystem: false

            capabilities:
              drop:
                - ALL

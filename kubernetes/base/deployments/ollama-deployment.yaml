apiVersion: apps/v1
kind: Deployment

metadata:
  name: ollama
  namespace: llm

spec:
  replicas: 1

  revisionHistoryLimit: 2

  # ReadWriteOnce volume + single replica: never run old and new pod together.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: ollama

  template:
    metadata:
      labels:
        app: ollama

    spec:
      containers:

        - name: ollama

          image: ollama/ollama@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c  # version 0.35.1

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 11434

          env:
            # Experiment-validity settings (controlled variables):
            - name: OLLAMA_KEEP_ALIVE   # never unload the model between requests
              value: "-1"
            - name: OLLAMA_NUM_PARALLEL  # one request at a time per replica
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"

          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama

          startupProbe:
            httpGet:
              path: /api/tags
              port: 11434
            periodSeconds: 5
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"

            limits:
              cpu: "2"
              memory: "4Gi"

      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc

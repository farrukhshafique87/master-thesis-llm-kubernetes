apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: ollama-pvc
  namespace: llm

spec:
  accessModes:
    - ReadWriteOnce

  # No storageClassName: the cluster default is used (Kind: "standard",
  # AKS/EKS/GKE: their default disk class). Keeps one base for all environments.

  resources:
    requests:
      storage: 15Gi

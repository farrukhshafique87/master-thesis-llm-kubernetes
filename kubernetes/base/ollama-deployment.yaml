apiVersion: apps/v1
kind: Deployment

metadata:
  name: ollama
  namespace: llm

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ollama

  template:
    metadata:
      labels:
        app: ollama

    spec:
      containers:

        - name: ollama

          image: ollama/ollama:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 11434

          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama

          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"

            limits:
              cpu: "2"
              memory: "4Gi"

      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc

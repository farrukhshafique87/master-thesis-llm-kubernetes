apiVersion: v1
kind: ConfigMap

metadata:
  name: fastapi-config
  namespace: llm
  labels:
    app.kubernetes.io/name: llm-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: llm-platform

data:
  APP_NAME: "LLM API"
  VERSION: "1.0.0"

  LOG_LEVEL: "INFO"

  REQUEST_TIMEOUT: "120"

  OLLAMA_URL: "http://ollama-service:11434"
  OLLAMA_MODEL: "qwen2.5:0.5b"

  # Controlled inference parameters (identical in every experiment)
  LLM_TEMPERATURE: "0.0"
  LLM_SEED: "42"
  LLM_NUM_PREDICT: "64"
  LLM_KEEP_ALIVE: "24h"
  OLLAMA_MAX_ATTEMPTS: "1"

# C6: all implemented controls. Entry: https://localhost:8443 with an API key.
# Path: Traefik (TLS) -> gateway -> FastAPI -> Ollama.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm-secure

resources:
  - ../../base

components:
  - ../../components/kind-placement
  - ../../components/gateway
  - ../../components/ingress-tls
  - ../../components/rbac
  - ../../components/network-policies
  - ../../components/network-policies-gateway-path
  - ../../components/network-policies-mesh
  - ../../components/mtls

patches:
  - target:
      kind: Ingress
      name: llm-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/name
        value: gateway-service
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/port/number
        value: 8080

# Environment: Kind (local)   Security level: SECURE
# Milestones 4/6 add the security controls here (one component per control so
# each can be enabled alone for RQ3, or all together for RQ1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm-secure

resources:
  - ../../base

components:
  - ../../components/kind-placement
  # Milestone 6: add one line per control, e.g.
  # - ../../components/rbac
  # - ../../components/network-policies
  # - ../../components/secrets
  # - ../../components/ingress-gateway

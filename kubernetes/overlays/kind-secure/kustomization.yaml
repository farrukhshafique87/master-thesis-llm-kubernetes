# Environment: Kind (local)   Security level: SECURE
# Milestones 4/6 add the security controls here (one component per control so
# each can be enabled alone for RQ3, or all together for RQ1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llm-secure

resources:
  - ../../base

components:
  - ../../components/kind-placement
  - ../../components/gateway
  - ../../components/ingress-tls
  # Milestone 6 adds more controls here, one line each:
  # - ../../components/rbac
  # - ../../components/network-policies
  # - ../../components/mtls

# Entry point of the secure setup: Traefik (HTTPS) -> gateway -> FastAPI.
patches:
  - target:
      kind: Ingress
      name: llm-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/name
        value: gateway-service
      - op: replace
        path: /spec/rules/0/http/paths/0/backend/service/port/number
        value: 8080
